<!DOCTYPE html><html lang="en"><head>

<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF5E00',
              accent: '#E65100',
              dark: '#121212',
              card: '#18181A',
              muted: '#71717A',
              subtle: '#A1A1AA',
              surface: '#F4F4F5',
            }

          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],

        }

<!-- Custom Styles: General & Animations -->
<style data-purpose="custom-styling">
    /* iOS smooth tap highlight removal */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Custom sheet shadow */
    .sheet-shadow {
      box-shadow: 0 -10px 40px -10px rgba(0, 0, 0, 0.28);
    }
    
    /* Smooth transition for bottom sheet dismissal */
    #bottom-sheet {
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    }

    #backdrop-overlay {
      transition: opacity 0.25s ease-out;
    }

</head>

<div class="h-1 flex-1 bg-[#FF5E00] rounded-full"></div>

</div>

</div>
<!-- END: BackgroundHomeScreen -->
<!-- BEGIN: ModalDimBackdrop -->
<!-- Translucent overlay behind sheet for dismiss touch handling -->
<div aria-hidden="true" class="absolute inset-0 bg-black/40 z-20 backdrop-blur-[1.5px] cursor-pointer" id="backdrop-overlay" onclick="closeSheet()">
</div>
<!-- END: ModalDimBackdrop -->
<!-- BEGIN: BottomSheetModal -->
<!-- Bottom Sheet Container sliding up with primary action items -->
<section aria-labelledby="modal-title" aria-modal="true" class="absolute bottom-0 inset-x-0 z-30 bg-white rounded-t-[34px] sheet-shadow pt-3 pb-8 px-6 flex flex-col transform translate-y-0" id="bottom-sheet" role="dialog">
<!-- Drag Pill Handle -->
<div class="w-full flex justify-center pb-3">
<div aria-hidden="true" class="w-10 h-1 bg-zinc-200 rounded-full"></div>
</div>
<!-- Sheet Header Title -->
<div class="mt-1 mb-5 text-center sm:text-left">
<h2 class="text-[23px] font-black text-zinc-950 tracking-tight leading-snug" id="modal-title">
          What would you like to add?
        </h2>
</div>
<!-- Action Items List -->
<div class="divide-y divide-zinc-100 flex flex-col">
<!-- Option 1: Import a Workout -->
<button class="w-full group flex items-center text-left py-4 transition-colors active:bg-zinc-50 rounded-xl focus:outline-none" onclick="selectAction('Import a Workout')" type="button">
<!-- Leading Icon -->
<div class="flex-shrink-0 mr-4 text-zinc-900 group-hover:text-brand-orange transition-colors">
<!-- Tray Arrow / Download Icon -->
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
<polyline points="7 11 12 16 17 11"></polyline>

</div>

            </span>

<path d="M6 3a3 3 0 0 0-3 3v13a2 2 0 0 0 2 2h13a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3H6zm1 4h2v8H7V7zm4 0h6a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-6V7z"></path>
</svg>
</div>
<!-- Label & Description -->

<span class="block text-[17px] font-bold text-zinc-950 tracking-tight group-hover:text-brand-orange transition-colors">

<div class="w-full flex justify-center pt-6 pb-1">

</div>

<!-- END: PhoneFrameWrapper -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="sheet-interactivity">
    // Micro-interactions to dismiss and reopen sheet smoothly
    function closeSheet() {
      const sheet = document.getElementById('bottom-sheet');
      const backdrop = document.getElementById('backdrop-overlay');
      const homeBg = document.getElementById('home-screen-bg');

      if (sheet && backdrop) {
        sheet.style.transform = 'translateY(100%)';
        backdrop.style.opacity = '0';
        backdrop.style.pointerEvents = 'none';

        if (homeBg) {
          homeBg.classList.remove('blur-[1.5px]', 'opacity-75');
          homeBg.classList.add('opacity-100');
          homeBg.style.pointerEvents = 'auto';
        }
      }
    }

    function selectAction(actionName) {
      console.log('Selected action:', actionName);
      closeSheet();
    }
  </script>
<!-- END: InteractiveScripts -->
</body></html>
