<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>FreakyFit - Target Muscle Focus</title>
<!-- Tailwind CSS CDN with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for FreakyFit Custom Theme -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              400: '#fb923c',
              500: '#ff5e00',
              600: '#ea580c',
              glow: 'rgba(255, 94, 0, 0.25)'
            },
            surface: {
              card: '#FFFFFF',
              subtle: '#F8FAFC',
              border: '#E2E8F0',
              muted: '#94A3B8'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'glow-orange': '0 4px 20px -2px rgba(255, 94, 0, 0.35)',
            'pill-active': '0 2px 8px rgba(0, 0, 0, 0.08)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Visual Enhancements -->
<style data-purpose="custom-enhancements">
    /* Subtle touch animations and scroll styling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .tap-press:active {
      transform: scale(0.98);
      transition: transform 0.1s ease;
    }
    .muscle-active {
      fill: #ff5e00 !important;
      filter: drop-shadow(0 0 6px rgba(255, 94, 0, 0.55));
      transition: all 0.3s ease;
    }
    .muscle-neutral {
      fill: #CBD5E1;
      transition: all 0.3s ease;
    }
  </style>
<!-- END: Custom Visual Enhancements -->
</head>
<body class="bg-surface-subtle text-slate-900 font-sans antialiased min-h-screen flex justify-center items-start selection:bg-brand-500 selection:text-white">
<!-- Mobile iOS Device Frame Container -->
<main class="w-full max-w-[430px] min-h-screen bg-white flex flex-col justify-between relative shadow-2xl overflow-hidden border-x border-slate-100">
<!-- BEGIN: TopNavigation -->
<header class="pt-12 px-5 pb-3 bg-white/90 backdrop-blur-md sticky top-0 z-30 flex flex-col gap-3">
<!-- Top Row: Back button, Logo and Step Counter -->
<div class="flex items-center justify-between">
<button aria-label="Go back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-slate-800 hover:bg-slate-100 tap-press transition" type="button">
<svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="flex items-center gap-1.5" data-purpose="brand-header">
<span class="text-xl font-black italic tracking-tighter text-slate-900 uppercase">Freaky<span class="text-brand-500">Fit</span></span>
</div>
<span class="text-xs font-semibold text-slate-400 tabular-nums">06 / 08</span>
</div>
<!-- Segmented Multi-Step Progress Bar -->
<div class="grid grid-cols-8 gap-1.5 w-full pt-1" data-purpose="onboarding-progress">
<div class="h-1.5 rounded-full bg-slate-900"></div>
<div class="h-1.5 rounded-full bg-slate-900"></div>
<div class="h-1.5 rounded-full bg-slate-900"></div>
<div class="h-1.5 rounded-full bg-slate-900"></div>
<div class="h-1.5 rounded-full bg-slate-900"></div>
<div class="h-1.5 rounded-full bg-brand-500 shadow-sm"></div>
<div class="h-1.5 rounded-full bg-slate-200"></div>
<div class="h-1.5 rounded-full bg-slate-200"></div>
</div>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: ContentArea -->
<section class="flex-1 px-5 pt-3 pb-24 overflow-y-auto no-scrollbar flex flex-col">
<!-- Title & Headline Section -->
<div class="mb-5 text-left">
<h1 class="text-2xl sm:text-[26px] font-black tracking-tight text-slate-900 leading-snug">
          Target muscle groups
        </h1>
<p class="text-xs sm:text-sm text-slate-500 font-medium mt-1.5 leading-relaxed">
          Select what you want to grow — our AI will prioritize workouts matching these areas.
        </p>
</div>
<!-- View Angle Switcher (Front/Back Segmented Switch) -->
<div class="flex justify-center mb-6">
<div aria-label="Muscle view orientation" class="bg-slate-100 p-1 rounded-full flex items-center border border-slate-200/80 shadow-inner w-full max-w-[280px]" role="tablist">
<button aria-selected="true" class="flex-1 py-2 rounded-full text-xs font-bold transition-all duration-200 bg-slate-900 text-white shadow-sm flex items-center justify-center gap-1.5" role="tab" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-brand-500 inline-block"></span>
            Front side
          </button>
<button aria-selected="false" class="flex-1 py-2 rounded-full text-xs font-bold text-slate-500 hover:text-slate-900 transition-all duration-200 flex items-center justify-center" role="tab" type="button">
            Back side
          </button>
</div>
</div>
<!-- Interactive 2-Column Split Layout -->
<div class="grid grid-cols-12 gap-3 items-start flex-1 min-h-[410px]">
<!-- Left Column: Muscle Group Selector Pills -->
<div class="col-span-6 flex flex-col gap-2.5" data-purpose="muscle-options-list">
<!-- Option: Chest (Selected) -->
<div class="tap-press group relative flex items-center gap-2.5 p-3 rounded-2xl bg-white border-2 border-brand-500 shadow-sm transition-all cursor-pointer">
<div class="w-5 h-5 rounded-full bg-brand-500 flex items-center justify-center text-white shrink-0 shadow-sm">
<svg class="w-3.5 h-3.5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-bold text-slate-900 tracking-tight">Chest</span>
</div>
<!-- Option: Shoulders (Selected) -->
<div class="tap-press group relative flex items-center gap-2.5 p-3 rounded-2xl bg-white border-2 border-brand-500 shadow-sm transition-all cursor-pointer">

<svg class="w-3.5 h-3.5 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-bold text-slate-900 tracking-tight">Shoulders</span>

<!-- Option: Biceps (Unselected) -->

<span class="text-xs font-semibold text-slate-600">Biceps</span>
</div>
<!-- Option: Triceps (Unselected) -->
<div class="tap-press group relative flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50/70 border border-slate-200 hover:border-slate-300 transition-all cursor-pointer">
<div class="w-5 h-5 rounded-full border-2 border-slate-300 group-hover:border-slate-400 bg-white shrink-0"></div>
<span class="text-xs font-semibold text-slate-600">Triceps</span>
</div>
<!-- Option: Abs & Core (Unselected) -->
<div class="tap-press group relative flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50/70 border border-slate-200 hover:border-slate-300 transition-all cursor-pointer">
<div class="w-5 h-5 rounded-full border-2 border-slate-300 group-hover:border-slate-400 bg-white shrink-0"></div>
<span class="text-xs font-semibold text-slate-600">Abs &amp; Core</span>
</div>
<!-- Option: Quads (Unselected) -->
<div class="tap-press group relative flex items-center gap-2.5 p-3 rounded-2xl bg-slate-50/70 border border-slate-200 hover:border-slate-300 transition-all cursor-pointer">
<div class="w-5 h-5 rounded-full border-2 border-slate-300 group-hover:border-slate-400 bg-white shrink-0"></div>
<span class="text-xs font-semibold text-slate-600">Quads</span>
</div>
</div>

<circle cx="89" cy="254" fill="#E2E8F0" r="5"></circle>
<circle cx="111" cy="254" fill="#E2E8F0" r="5"></circle>
<!-- Neutral Lower Body: Calves, Shins & Feet -->

<path class="muscle-neutral" d="M85 262 C90 263 94 274 92 296 C89 316 87 325 84 326 C82 316 80 295 81 278 C82 268 83 263 85 262 Z"></path>

<!-- Feet -->

<path class="muscle-neutral" d="M119 332 C115 332 113 338 112 344 H122 C122 338 121 332 119 332 Z"></path>
</svg>
<!-- Subtle Tag Indicator Overlay -->
<div class="absolute -bottom-2 right-2 flex items-center gap-1.5 bg-brand-50 border border-brand-100 px-2.5 py-1 rounded-full shadow-xs">
<span class="w-1.5 h-1.5 rounded-full bg-brand-500 animate-pulse"></span>
<span class="text-[10px] font-bold text-brand-600 tracking-wider uppercase">Anterior</span>
</div>
</div>
</div>
</div>
<!-- Live Selection Summary Badge -->
<div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-brand-500"></div>
<span class="text-xs font-semibold text-slate-700">2 muscle groups focused</span>
</div>
<button class="text-xs font-bold text-brand-600 hover:text-brand-500 transition" type="button">
          Clear all
        </button>
</div>
</section>
<!-- END: ContentArea -->
<!-- BEGIN: StickyFooterCTA -->
<footer class="p-5 bg-white/95 backdrop-blur-md border-t border-slate-100 fixed bottom-0 max-w-[430px] w-full z-40">
<button class="tap-press w-full py-4 px-6 rounded-2xl bg-brand-500 hover:bg-brand-600 text-white font-extrabold text-base tracking-wide shadow-glow-orange flex items-center justify-center gap-2 transition-all" type="button">
<span>Continue (2 selected)</span>
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</footer>
<!-- END: StickyFooterCTA -->
</main>
</body></html>
