<script>
  (function initGenderSelection() {
    const options = document.querySelectorAll('.gender-option');
    const activeTag = document.getElementById('active-tag');
    const metabolicLabel = document.getElementById('metabolic-rate-label');
    const statusText = document.getElementById('physique-status');
    const avatar = document.getElementById('physique-avatar');

    const avatars = {
      'man': 'Front full-length studio portrait cutout of a high-performance male athlete standing centered in sleek black training shorts against a pristine pure white high-contrast background with soft warm ambient shadows FreakyFit performance kinetic aesthetic',
      'woman': 'Front full-length studio portrait cutout of an athletic female runner in black sportswear training crop top and compression shorts against a crisp white clean high-contrast backdrop FreakyFit aesthetic',
      'non-binary': 'Front full-length athletic individual standing centered wearing charcoal minimalist sportswear performance training gear high contrast studio pure white background',
      'neutral': 'Minimalist athletic human silhouette mannequin standing centered in clean studio lighting with soft kinetic orange rim glow on white background'
    };

    options.forEach(btn => {
      btn.addEventListener('click', () => {
        options.forEach(o => {
          o.setAttribute('aria-checked', 'false');
          o.style.boxShadow = '';
          const iconWrapper = o.querySelector('.indicator-icon');
          const leadingIcon = o.querySelector('.rounded-lg');
          if (iconWrapper) {
            iconWrapper.className = 'indicator-icon w-6 h-6 rounded-full bg-surface-container flex items-center justify-center shrink-0';
            iconWrapper.innerHTML = '<span class="material-symbols-outlined text-[16px] text-surface-container-highest">circle</span>';
          }
          if (leadingIcon) {
            leadingIcon.className = 'w-9 h-9 rounded-lg bg-surface-container flex items-center justify-center text-on-surface shrink-0 transition-colors';
          }
        });

        // Set Selected
        btn.setAttribute('aria-checked', 'true');
        btn.style.boxShadow = '0 0 0 2px #ff5e00, 0 4px 14px rgba(255, 94, 0, 0.20)';

        const activeIndicator = btn.querySelector('.indicator-icon');
        const activeLeadingIcon = btn.querySelector('.rounded-lg');
        if (activeIndicator) {
          activeIndicator.className = 'indicator-icon w-6 h-6 rounded-full bg-primary-container text-white flex items-center justify-center shrink-0 shadow-sm';
          activeIndicator.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span>';
        }
        if (activeLeadingIcon) {
          activeLeadingIcon.className = 'w-9 h-9 rounded-lg bg-primary-fixed flex items-center justify-center text-primary-container shrink-0 shadow-sm transition-colors';
        }

        // Update telemetry data
        const genderKey = btn.dataset.gender;
        if (activeTag) activeTag.textContent = btn.dataset.code || 'M-01';
        if (metabolicLabel) metabolicLabel.textContent = btn.dataset.bmr || 'CALIBRATED';
        if (statusText) statusText.textContent = btn.dataset.status || 'Target Adjusted';

        // Update visual image prompt attribute
        if (avatar && avatars[genderKey]) {
          avatar.setAttribute('data-alt', avatars[genderKey]);
          avatar.style.transform = 'scale(0.97)';
          setTimeout(() => {
            avatar.style.transform = 'scale(1)';
          }, 150);
        }
      });
    });
  })();
