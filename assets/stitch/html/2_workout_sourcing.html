<!-- BEGIN: InteractiveScript -->
<script data-purpose="selection-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const checkboxes = document.querySelectorAll('input[name="sources"]');
      const ctaText = document.getElementById('cta-text');
      const ctaBtn = document.getElementById('cta-button');

      function updateCounter() {
        const checkedCount = document.querySelectorAll('input[name="sources"]:checked').length;
        if (checkedCount === 0) {
          ctaText.textContent = "Select at least 1";
          ctaBtn.classList.add('opacity-50', 'pointer-events-none');
        } else {
          ctaText.textContent = `Continue (${checkedCount} selected)`;
          ctaBtn.classList.remove('opacity-50', 'pointer-events-none');
        }
      }

      checkboxes.forEach(chk => {
        chk.addEventListener('change', updateCounter);
      });

      updateCounter();
    });
  </script>
