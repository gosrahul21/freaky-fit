<script>
    let currentHeightCm = 170;
    let currentUnit = 'metric';
    const minHeight = 145;
    const maxHeight = 205;

    const interactionStage = document.getElementById('height-interaction-stage');
    const interactiveCursor = document.getElementById('interactive-cursor');
    const mainValEl = document.getElementById('metric-main-value');
    const unitLabelEl = document.getElementById('metric-unit-label');
    const secValEl = document.getElementById('secondary-converted-val');
    const athleteSilhouette = document.getElementById('athlete-silhouette');
    const toggleMetric = document.getElementById('toggle-metric');
    const toggleImperial = document.getElementById('toggle-imperial');

    function updateVisuals() {
      const percentage = (maxHeight - currentHeightCm) / (maxHeight - minHeight);
      const clampedPct = Math.max(0.05, Math.min(0.95, percentage));
      interactiveCursor.style.top = (clampedPct * 100) + '%';

      const scaleFactor = 0.85 + ((currentHeightCm - minHeight) / (maxHeight - minHeight)) * 0.25;
      if (athleteSilhouette) {
        athleteSilhouette.style.transform = 'scale(' + scaleFactor + ')';
        athleteSilhouette.style.transformOrigin = 'bottom center';
      }

      if (currentUnit === 'metric') {
        mainValEl.textContent = Math.round(currentHeightCm);
        unitLabelEl.textContent = 'cm';
        const totalInches = Math.round(currentHeightCm / 2.54);
        const feet = Math.floor(totalInches / 12);
        const inches = totalInches % 12;
        secValEl.textContent = feet + "'" + inches + '"';
      } else {
        const totalInches = Math.round(currentHeightCm / 2.54);
        const feet = Math.floor(totalInches / 12);
        const inches = totalInches % 12;
        mainValEl.textContent = feet + "'" + inches + '"';
        unitLabelEl.textContent = '';
        secValEl.textContent = Math.round(currentHeightCm) + ' cm';
      }
    }

    function setUnit(unit) {
      currentUnit = unit;
      if (unit === 'metric') {
        toggleMetric.className = 'px-5 py-1.5 rounded-full font-label-lg text-label-lg transition-all duration-200 bg-inverse-surface text-inverse-on-surface shadow-md font-bold';
        toggleImperial.className = 'px-5 py-1.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      } else {
        toggleImperial.className = 'px-5 py-1.5 rounded-full font-label-lg text-label-lg transition-all duration-200 bg-inverse-surface text-inverse-on-surface shadow-md font-bold';
        toggleMetric.className = 'px-5 py-1.5 rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface';
      }
      updateVisuals();
    }

    function handlePointer(e) {
      const rect = interactionStage.getBoundingClientRect();
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const offsetY = clientY - rect.top;
      const normalized = Math.max(0, Math.min(1, offsetY / rect.height));
      const targetCm = maxHeight - (normalized * (maxHeight - minHeight));
      currentHeightCm = Math.max(minHeight, Math.min(maxHeight, targetCm));
      updateVisuals();
    }

    let isDragging = false;
    interactionStage.addEventListener('pointerdown', function(e) {
      isDragging = true;
      handlePointer(e);
      interactionStage.setPointerCapture(e.pointerId);
    });

    interactionStage.addEventListener('pointermove', function(e) {
      if (isDragging) {
        handlePointer(e);
      }
    });

    interactionStage.addEventListener('pointerup', function(e) {
      isDragging = false;
      try { interactionStage.releasePointerCapture(e.pointerId); } catch(err){}
    });

    interactionStage.addEventListener('pointercancel', function(e) {
      isDragging = false;
    });

    updateVisuals();
  </script>
