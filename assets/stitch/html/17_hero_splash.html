<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>FreakyFit - Turn Any Video Into Workout Plans</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Oswald (Athletic Header) & Plus Jakarta Sans (Modern Body) -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#FF5E00',
              orangeDark: '#E04F00',
              orangeLight: '#FFF4EE',
              obsidian: '#111317',
              slateText: '#0F172A',
              muted: '#64748B',
              surface: '#F8FAFC',
              cardBorder: '#E2E8F0',
            }
          },
          fontFamily: {
            athletic: ['Oswald', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            'phone-glow': '0 24px 48px -12px rgba(255, 94, 0, 0.18), 0 12px 24px -8px rgba(17, 19, 23, 0.08)',
            'btn-glow': '0 10px 25px -4px rgba(255, 94, 0, 0.35)',
            'inner-sheen': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.8)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-typography">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-athletic {
      font-family: 'Oswald', sans-serif;
      letter-spacing: -0.02em;
    }
    /* Gradient text for the vibrant highlighted keyword */
    .highlight-gradient {
      background: linear-gradient(135deg, #FF5E00 0%, #FF8A00 45%, #E02875 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
<style data-purpose="device-mockup-styling">
    /* Subtle metallic frame illusion for device mockup */
    .mockup-rim {
      box-shadow: 
        0 0 0 4px #1E232B,
        0 0 0 6px #0D1015,
        0 20px 40px -15px rgba(255, 94, 0, 0.22),
        0 12px 28px -10px rgba(0, 0, 0, 0.12);
    }
    /* Dynamic Island pill */
    .dynamic-island {
      width: 82px;
      height: 22px;
      background-color: #000000;
      border-radius: 20px;
    }
    /* Camera lens glare */
    .lens-point {
      width: 7px;
      height: 7px;
      background: radial-gradient(circle, #1a2233 40%, #080c14 100%);
      border-radius: 50%;
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-white text-brand-slateText antialiased min-h-screen flex justify-center items-center p-0 sm:p-4 selection:bg-brand-orange selection:text-white">
<!-- BEGIN: Main Mobile Frame Container -->
<!-- Constrained strictly for authentic iOS mobile viewport flow -->
<main class="w-full max-w-[420px] min-h-screen sm:min-h-[844px] bg-white sm:rounded-[44px] sm:border-[8px] sm:border-slate-900 flex flex-col justify-between overflow-hidden shadow-2xl relative">
<!-- BEGIN: Top iOS Status Bar Area -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 select-none" data-purpose="ios-safe-area-header">
<!-- iOS Time -->
<span class="text-sm font-semibold tracking-tight text-brand-obsidian">9:41</span>
<!-- iOS Right Telemetry Icons -->
<div class="flex items-center space-x-2 text-brand-obsidian">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5" fill="currentColor" viewBox="0 0 18 14">
<path d="M1 10.5C1 10.2239 1.22386 10 1.5 10H3.5C3.77614 10 4 10.2239 4 10.5V13.5C4 13.7761 3.77614 14 3.5 14H1.5C1.22386 14 1 13.7761 1 13.5V10.5Z"></path>
<path d="M5.5 7.5C5.5 7.22386 5.72386 7 6 7H8C8.27614 7 8.5 7.22386 8.5 7.5V13.5C8.5 13.7761 8.27614 14 8 14H6C5.72386 14 5.5 13.7761 5.5 13.5V7.5Z"></path>
<path d="M10 4.5C10 4.22386 10.2239 4 10.5 4H12.5C12.7761 4 13 4.22386 13 4.5V13.5C13 13.7761 12.7761 14 12.5 14H10.5C10.2239 14 10 13.7761 10 13.5V4.5Z"></path>
<path d="M14.5 1.5C14.5 1.22386 14.7239 1 15 1H17C17.2761 1 17.5 1.22386 17.5 1.5V13.5C17.5 13.7761 17.2761 14 17 14H15C14.7239 14 14.5 13.7761 14.5 13.5V1.5Z"></path>
</svg>
<!-- Wi-Fi -->
<svg class="w-4 h-3.5" fill="currentColor" viewBox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2C5.074 2 2.457 3.23 0.626 5.21a.75.75 0 101.098 1.02C3.303 4.52 5.518 3.5 8 3.5c2.482 0 4.697 1.02 6.276 2.73a.75.75 0 001.098-1.02C13.543 3.23 10.926 2 8 2zm-5.228 5.485A6.47 6.47 0 018 6c1.97 0 3.738.877 4.935 2.27.28.324.753.356 1.058.07a.75.75 0 00.069-1.057C12.565 5.56 10.428 4.5 8 4.5c-2.428 0-4.565 1.06-6.062 2.783a.75.75 0 00.069 1.057c.305.286.778.254 1.058-.07zM8 9.5a2.5 2.5 0 00-1.768.732.75.75 0 001.06 1.06A1 1 0 018 11a1 1 0 01.708.292.75.75 0 001.06-1.06A2.5 2.5 0 008 9.5z" fill-rule="evenodd"></path>
</svg>
<!-- Battery -->
<div class="w-6 h-3 border border-brand-obsidian rounded-sm p-0.5 flex items-center relative">
<div class="h-full bg-brand-obsidian rounded-2xs w-4"></div>
<div class="absolute -right-1 top-0.8 w-0.5 h-1.5 bg-brand-obsidian rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: Top iOS Status Bar Area -->
<!-- BEGIN: Top Mockup Showcase Section -->
<section class="flex-1 flex flex-col items-center justify-center pt-2 px-6" data-purpose="device-hero-mockup">
<!-- Outer Smartphone Mockup Container -->
<div class="w-[245px] h-[375px] bg-[#111317] rounded-[42px] mockup-rim p-2 flex flex-col relative transition-transform duration-300 hover:scale-[1.02]">
<!-- Left Side Buttons Hint (Volume Rockers) -->
<div class="absolute -left-[5px] top-20 w-[3px] h-8 bg-slate-700 rounded-l-sm"></div>
<div class="absolute -left-[5px] top-32 w-[3px] h-8 bg-slate-700 rounded-l-sm"></div>
<!-- Right Side Button Hint (Power) -->
<div class="absolute -right-[5px] top-24 w-[3px] h-12 bg-slate-700 rounded-r-sm"></div>
<!-- Phone Screen Surface -->
<div class="w-full h-full bg-gradient-to-b from-[#FFF5EE] via-[#FFEADB] to-[#FFF9F5] rounded-[34px] overflow-hidden flex flex-col items-center pt-2.5 pb-4 px-4 relative border border-orange-200/50 shadow-inner">
<!-- Dynamic Island Notch -->
<div class="dynamic-island flex items-center justify-end pr-2.5 space-x-1.5 shadow-sm mb-4">
<span class="lens-point"></span>
</div>
<!-- Athletic Emblem / App Badge -->
<div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-orange to-[#FF7B29] p-0.5 shadow-md flex items-center justify-center mt-1">
<div class="w-full h-full bg-white rounded-[14px] flex items-center justify-center relative overflow-hidden">
<!-- Radial subtle backdrop glow -->
<div class="absolute inset-0 bg-brand-orange/10"></div>
<!-- FreakyFit Lightning Bolt Icon -->
<svg class="w-9 h-9 text-brand-orange fill-current drop-shadow-sm transform -rotate-6" viewBox="0 0 24 24">
<path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"></path>
</svg>
</div>
</div>
<!-- FreakyFit Wordmark -->
<div class="mt-3 flex items-center space-x-1">
<span class="font-athletic text-2xl font-bold tracking-tight text-brand-obsidian uppercase">Freaky<span class="text-brand-orange">Fit</span></span>
</div>
<!-- Decorative Tagline in Mockup (Matches Reference Layout) -->
<div class="mt-auto mb-6 text-center max-w-[190px]">
<span class="inline-block px-2.5 py-0.5 rounded-full bg-brand-orange/10 text-brand-orange text-[10px] font-bold uppercase tracking-widest mb-1.5">
              Smart Scanner
            </span>
<p class="font-athletic text-2xl font-bold uppercase leading-tight text-brand-obsidian">
              Have <br>
<span class="text-brand-orange">Thousands Of</span> <br>
              Workout <br>
              Videos?
            </p>
</div>
<!-- Mini screen indicator bar at phone bottom -->
<div class="w-24 h-1 bg-brand-obsidian/30 rounded-full mt-auto"></div>
</div>
</div>
</section>
<!-- END: Top Mockup Showcase Section -->
<!-- BEGIN: Value Proposition & CTA Section -->
<section class="w-full px-6 pt-5 pb-6 flex flex-col items-center text-center bg-white z-10" data-purpose="onboarding-controls">
<!-- Primary Core Headline -->
<h1 class="font-athletic text-[2.45rem] leading-[1.08] font-bold text-brand-obsidian tracking-tight uppercase max-w-[340px]">
        Turn Any <span class="highlight-gradient font-black">Video</span><br>Into Workout Plans
      </h1>
<!-- Supporting Microcopy -->
<p class="text-sm font-medium text-brand-muted mt-2.5 max-w-[280px]">
        Instant AI exercise extraction from TikTok, Instagram Reels &amp; YouTube.
      </p>
<!-- Primary Action Button (Rounded Pill CTA) -->
<div class="w-full mt-6" data-purpose="primary-action-container">
<a class="w-full py-4 px-8 bg-brand-obsidian hover:bg-brand-orange active:scale-[0.98] text-white font-bold text-base tracking-wide rounded-full flex items-center justify-center shadow-lg transition-all duration-200 group" href="#get-started" role="button">
<span>Get Started</span>
<svg class="w-4 h-4 ml-2 transition-transform duration-200 group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
<!-- Secondary Navigation Link -->
<div class="mt-4 pt-1 mb-2">
<p class="text-[13px] text-brand-muted font-medium">
          Already have an account? 
          <a class="text-brand-orange hover:text-brand-orangeDark font-bold ml-1 hover:underline transition-colors" href="#signin">
            Sign In
          </a>
</p>
</div>
<!-- iOS Home Bar Indicator -->
<div class="w-32 h-1 bg-brand-obsidian/25 rounded-full mt-3 select-none"></div>
</section>
<!-- END: Value Proposition & CTA Section -->
</main>
<!-- END: Main Mobile Frame Container -->
</body></html>
