<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>FreakyFit - Imported Workout</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Oswald (Headings & Numbers) & Plus Jakarta Sans (Body) -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#ff5e00',
              'orange-light': '#fff1eb',
              black: '#0a0a0b',
              gray: {
                50: '#f8f9fa',
                100: '#f3f4f5',
                200: '#e5e7eb',
                400: '#9ca3af',
                600: '#4b5563',
                800: '#1f2937'
              }
            }
          },
          fontFamily: {
            oswald: ['Oswald', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Animations & Layout -->
<style data-purpose="kinetic-animations">
    @keyframes dashCycle {
      0% {
        stroke-dashoffset: 24;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes pulseGaze {
      0%, 100% {
        opacity: 0.95;
        transform: scale(1);
      }
      50% {
        opacity: 0.65;
        transform: scale(0.995);
      }
    }

    .animate-dash {
      animation: dashCycle 1.2s linear infinite;
    }

    .pulse-subtle {
      animation: pulseGaze 2.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#f8f9fa] text-brand-black font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-brand-orange selection:text-white">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-md mx-auto min-h-screen flex flex-col justify-between bg-white px-6 pt-5 pb-8 shadow-sm">
<!-- BEGIN: TopBar -->
<header class="w-full flex items-center justify-between pt-2">
<div class="flex items-center space-x-2">
<h1 class="text-2xl sm:text-[28px] font-bold tracking-tight font-sans text-black">
          Imported workout
        </h1>
</div>
<!-- Close Action Button -->
<button aria-label="Close" class="w-11 h-11 rounded-full bg-brand-gray-100 active:scale-95 transition-transform flex items-center justify-center text-gray-700 hover:text-black hover:bg-brand-gray-200" data-purpose="close-button" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24">
<line x1="18" x2="6" y1="6" y2="18"></line>
<line x1="6" x2="18" y1="6" y2="18"></line>
</svg>
</button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: CoreProgressSection -->
<main class="flex-1 flex flex-col items-center justify-center my-auto py-10 w-full">
<!-- Status Text -->
<div class="text-center mb-10">
<h2 class="text-xl sm:text-2xl font-semibold tracking-tight text-gray-900 font-sans">
          Analyzing the workout...
        </h2>
<p class="text-xs uppercase tracking-widest font-semibold text-brand-orange mt-2">
          AI Motion &amp; Rep Parser
        </p>
</div>
<!-- Kinetic Diagram (Point A to Point B) -->
<div class="relative w-full max-w-[320px] flex items-center justify-between px-2 mb-12 select-none" data-purpose="diagram-container">
<!-- Node A: Source / Origin Clip -->
<div class="flex flex-col items-center">
<div class="w-14 h-14 rounded-xl border-2 border-black bg-white flex items-center justify-center shadow-sm relative z-10 transition-transform hover:scale-105">
<span class="font-oswald text-2xl font-bold italic tracking-wider text-black">A</span>
</div>
<span class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mt-2">Source</span>
</div>
<!-- Looping Kinetic Connector Curve -->
<div class="absolute inset-0 top-0 pointer-events-none flex items-center justify-center z-0 px-12">
<svg class="w-full h-24 overflow-visible" fill="none" viewBox="0 0 240 70">
<!-- Top Looping Slinky Path (Gray wireframe coil like reference) -->
<path class="opacity-70" d="M 16,42 
                 C 20,5 50,5 45,35 
                 C 40,55 75,5 75,35 
                 C 75,55 110,5 110,35 
                 C 110,55 145,5 145,35 
                 C 145,55 175,10 188,40" fill="none" stroke="#9ca3af" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
<!-- Direct Kinetic Dashed Arrow Path in Brand Orange -->
<path class="animate-dash" d="M 28,45 L 182,45" stroke="#ff5e00" stroke-dasharray="6 6" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Energetic Orange Arrow Head at Destination -->
<path d="M 175,39 L 187,45 L 175,51" stroke="#ff5e00" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"></path>
</svg>
</div>
<!-- Node B: Target Structured Plan -->
<div class="flex flex-col items-center">
<div class="w-14 h-14 rounded-xl border-2 border-black bg-white flex items-center justify-center shadow-sm relative z-10 transition-transform hover:scale-105">
<span class="font-oswald text-2xl font-bold italic tracking-wider text-black">B</span>
</div>
<span class="text-[11px] font-bold uppercase tracking-wider text-gray-400 mt-2">Log</span>
</div>
</div>
<!-- Prominent Percentage Metric -->
<div class="flex flex-col items-center justify-center">
<div class="text-[88px] sm:text-[104px] font-bold font-sans tracking-tighter text-black leading-none select-none">
          86<span class="text-[72px] sm:text-[84px] font-extrabold tracking-normal">%</span>
</div>
<!-- Dynamic Kinetic Sub-indicator -->
<div class="mt-4 flex items-center space-x-2 bg-brand-orange-light/80 px-3.5 py-1.5 rounded-full border border-brand-orange/20">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-orange opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-brand-orange"></span>
</span>
<span class="text-xs font-semibold text-brand-orange tracking-wide">
            Calibrating exercises &amp; sets
          </span>
</div>
</div>
</main>
<!-- END: CoreProgressSection -->
<!-- BEGIN: BottomAction -->
<footer class="w-full pb-2">
<!-- Continue in Background Button -->
<button class="w-full py-4 px-6 rounded-full bg-brand-black hover:bg-black active:scale-[0.98] text-white font-bold text-base tracking-wide transition-all shadow-md flex items-center justify-center" data-purpose="action-background-btn" type="button">
        Continue in background
      </button>
<!-- iOS Home Indicator Pill -->
<div class="w-32 h-1 bg-gray-300 rounded-full mx-auto mt-6"></div>
</footer>
<!-- END: BottomAction -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
